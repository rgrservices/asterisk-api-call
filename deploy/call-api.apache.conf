# ─── Call Origination API — Configuração Apache (FreePBX local) ──────────────
#
# CONTEXTO DE USO:
#   O tráfego externo chega via NGINX Proxy Manager (NPM) em outro servidor,
#   que encaminha para o Apache do FreePBX (porta 80). Este arquivo configura
#   o Apache local para repassar as rotas da API ao Uvicorn (porta 8000).
#
#   Internet → NPM (HTTPS) → Apache FreePBX :80 → Uvicorn :8000
#
# COMO INCLUIR:
#   Dentro do seu VirtualHost em /etc/httpd/conf.d/freepbx.conf:
#
#     Include /opt/call-api/deploy/call-api.apache.conf
#
# ATIVAÇÃO DOS MÓDULOS (se necessário):
#   CentOS/Rocky (FreePBX): geralmente já habilitados pelo FreePBX.
#   Verifique com: httpd -M | grep proxy
# ──────────────────────────────────────────────────────────────────────────────

# Repassar cabeçalhos do NPM para a API (X-Forwarded-For, X-Forwarded-Proto)
ProxyPreserveHost On

# ─── Endpoints públicos da API ────────────────────────────────────────────────

ProxyPass        /api/v1        http://127.0.0.1:8000/api/v1
ProxyPassReverse /api/v1        http://127.0.0.1:8000/api/v1

ProxyPass        /health        http://127.0.0.1:8000/health
ProxyPassReverse /health        http://127.0.0.1:8000/health

ProxyPass        /openapi.json  http://127.0.0.1:8000/openapi.json
ProxyPassReverse /openapi.json  http://127.0.0.1:8000/openapi.json

ProxyPass        /docs          http://127.0.0.1:8000/docs
ProxyPassReverse /docs          http://127.0.0.1:8000/docs

ProxyPass        /redoc         http://127.0.0.1:8000/redoc
ProxyPassReverse /redoc         http://127.0.0.1:8000/redoc

# ─── Painel administrativo — NÃO publique via NPM ────────────────────────────
#
# ATENÇÃO: NÃO adicione /admin abaixo e NÃO configure o NPM para rotear /admin.
#
# O Apache enxerga apenas o IP do NPM (rede interna), não o IP real do usuário.
# Um bloqueio por IP aqui NÃO funcionaria para filtrar acessos externos.
#
# Acesse o painel admin de duas formas seguras:
#
# OPÇÃO 1 — SSH tunnel (recomendado):
#   ssh -L 9000:localhost:8000 usuario@freepbx.montezumaeconde.adv.br
#   Depois abra: http://localhost:9000/admin/
#
# OPÇÃO 2 — Direto no servidor (dentro da rede local):
#   http://IP-DO-FREEPBX:8000/admin/
