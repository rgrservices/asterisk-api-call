; =============================================================================
; Call API — contexto de playback de gravações
; Instalar em /etc/asterisk/extensions_custom.conf (ou incluir este arquivo).
;
; IMPORTANTE (FreePBX): edite este bloco diretamente no arquivo — a UI do
; FreePBX pode remover ${AUDIO_FILE} se colado pelo painel web.
;
; Fluxo AMI:
;   Channel: Local/{dial_prefix}{numero}@from-internal
;   Context: call-api-playback / Exten: s
;   Variable: __AUDIO_FILE=custom/{client_id}/{arquivo}
; Quando o destino atende, o Asterisk executa Playback() neste contexto.
; =============================================================================
[call-api-playback]
exten => s,1,NoOp(Call API Playback - file=${AUDIO_FILE})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(${AUDIO_FILE})
 same => n,Hangup()
