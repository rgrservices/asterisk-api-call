<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Call API Admin{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .navbar-brand { font-weight: 600; letter-spacing: .5px; }
    .table th { font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; }
    .badge-active   { background-color: #198754; }
    .badge-inactive { background-color: #6c757d; }
    code { color: #d63384; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/adminAPI/">
      <i class="bi bi-telephone-fill me-1"></i>Call API
    </a>
    <div class="navbar-nav ms-auto align-items-center gap-2">
      <a class="nav-link" href="/adminAPI/clients"><i class="bi bi-people me-1"></i>Clientes</a>
      <a class="nav-link" href="/adminAPI/logs"><i class="bi bi-journal-text me-1"></i>Logs</a>
      <a class="nav-link" href="/docs" target="_blank"><i class="bi bi-code-slash me-1"></i>Swagger</a>
      <form method="post" action="/adminAPI/logout" class="d-inline">
        <button type="submit" class="btn btn-outline-light btn-sm">
          <i class="bi bi-box-arrow-right me-1"></i>Sair
        </button>
      </form>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 py-4" style="max-width: 1200px;">
  {% if request.query_params.get('msg') %}
  <div class="alert alert-{{ request.query_params.get('msg_type', 'info') }} alert-dismissible fade show" role="alert">
    {{ request.query_params.get('msg') }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endif %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
